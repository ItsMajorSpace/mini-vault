# Mini Vault's server stack (ADR 0003). From this directory:
#   cp .env.example .env   # then set real secrets
#   docker compose up -d --build
# Host ports are bound to 127.0.0.1 only; the Android emulator reaches them at 10.0.2.2.
#   GoTrue (auth)   http://localhost:9999
#   PowerSync       http://localhost:8080
#   Write API       http://localhost:8000
#   Postgres        localhost:5432 (for the server tests)
#   Mailpit         http://localhost:8025 (dev only: catches GoTrue's emails)

services:
  postgres:
    image: postgres:18.7-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      POWERSYNC_DB_PASSWORD: ${POWERSYNC_DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth:
    image: supabase/gotrue:v2.197.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${AUTH_DB_PASSWORD}@postgres:5432/postgres?sslmode=disable
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: ${JWT_EXPIRY}
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: ${MAILER_AUTOCONFIRM}
      GOTRUE_SMTP_HOST: ${SMTP_HOST}
      GOTRUE_SMTP_PORT: ${SMTP_PORT}
      GOTRUE_SMTP_USER: ${SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL}
      GOTRUE_SMTP_SENDER_NAME: Mini Vault
      # A code to type into the app, not a link (write_api.dart's recoveryEmail), fetched when an email is sent.
      GOTRUE_MAILER_TEMPLATES_RECOVERY: http://api:8000/email/recovery
      GOTRUE_MAILER_SUBJECTS_RECOVERY: Your Mini Vault password reset code
    ports:
      - "127.0.0.1:9999:9999"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Dev only (COMPOSE_PROFILES=dev): catches every email GoTrue sends, readable at :8025 and over its HTTP API.
  mailpit:
    image: axllent/mailpit:v1.27.11
    profiles: [dev]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"

  # One-shot: creates the synced tables, the starter-Workflow trigger and the publication, then exits.
  migrate:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: mini-vault-server:local
    command: ["migrate"]
    depends_on:
      auth:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/postgres?sslmode=disable

  api:
    image: mini-vault-server:local
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/postgres?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      PHOTOS_DIR: /photos
      PORT: 8000
    volumes:
      # Photo files, one directory per user.
      - photos:/photos
    ports:
      - "127.0.0.1:8000:8000"

  powersync:
    image: journeyapps/powersync-service:1.28.3
    restart: unless-stopped
    command: ["start", "-r", "unified"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./powersync:/config:ro
    environment:
      POWERSYNC_CONFIG_PATH: /config/service.yaml
      # About 80% of the memory this container may use.
      NODE_OPTIONS: --max-old-space-size=800
      PS_DATA_SOURCE_URI: postgres://powersync_role:${POWERSYNC_DB_PASSWORD}@postgres:5432/postgres
      PS_STORAGE_SOURCE_URI: postgres://powersync_role:${POWERSYNC_DB_PASSWORD}@postgres:5432/powersync_storage
      PS_JWT_SECRET: ${JWT_SECRET}
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/probes/liveness').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 2s
      retries: 15

volumes:
  pg_data:
  photos:
