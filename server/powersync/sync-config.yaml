# Each user receives only the rows they own. Restart the powersync service after changing this file.
# Reference: https://docs.powersync.com/sync/streams/overview

config:
  edition: 3

streams:
  own_rows:
    auto_subscribe: true
    queries:
      - SELECT * FROM workflows WHERE owner_id = auth.user_id()
      - SELECT * FROM stages WHERE owner_id = auth.user_id()
      - SELECT * FROM collections WHERE owner_id = auth.user_id()
      - SELECT * FROM units WHERE owner_id = auth.user_id()
      - SELECT * FROM stage_changes WHERE owner_id = auth.user_id()
      - SELECT * FROM unit_tags WHERE owner_id = auth.user_id()
      - SELECT * FROM photos WHERE owner_id = auth.user_id()
      - SELECT * FROM splits WHERE owner_id = auth.user_id()
      - SELECT * FROM merges WHERE owner_id = auth.user_id()
      - SELECT * FROM paints WHERE owner_id = auth.user_id()
      - SELECT * FROM squad_paints WHERE owner_id = auth.user_id()
      - SELECT * FROM squad_notes WHERE owner_id = auth.user_id()
      - SELECT * FROM squad_tags WHERE owner_id = auth.user_id()
      - SELECT * FROM squad_photos WHERE owner_id = auth.user_id()
