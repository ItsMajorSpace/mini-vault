name: Deploy to Production

# Runs after a green CI run on main (deploys that commit's sha-<short> image), or by hand with an image tag
# (rollback). See docs/deploy.md for the one-time setup.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy: sha-<short> (one specific commit), main (latest main build) or a release tag such as v1.2.3"
        required: true
        type: string

# Never run two deploys at once, and never cancel one halfway through.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Deploy
    # The automatic path waits for the DEPLOY_ENABLED repository variable, so merges don't fail before the
    # secrets are set up. Tag pushes also run CI; only pushes to main deploy.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.DEPLOY_ENABLED == 'true' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      INPUT_TAG: ${{ inputs.image_tag }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      # The compose file and config of the deployed commit; a manual run uses main's.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      # Secrets are passed through `env:` and never interpolated into script text, so quotes, $, # and
      # backslashes in values are safe. The file is written on the runner and uploaded over SCP; it is never printed.
      - name: Render .env from secrets
        id: render
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          AUTH_DB_PASSWORD: ${{ secrets.AUTH_DB_PASSWORD }}
          POWERSYNC_DB_PASSWORD: ${{ secrets.POWERSYNC_DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRY: ${{ secrets.JWT_EXPIRY }}
        run: |
          set -euo pipefail

          # CI's metadata-action tags each main build sha-<first 7 characters of the commit>.
          if [ -n "$HEAD_SHA" ]; then tag="sha-${HEAD_SHA:0:7}"; else tag="$INPUT_TAG"; fi
          if [[ ! "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Invalid image_tag. Allowed: letters, digits, '_', '.', '-' (max 128 chars)."
            exit 1
          fi
          echo "image_tag=$tag" >> "$GITHUB_OUTPUT"

          umask 077
          out=server/deploy.env
          : > "$out"

          # Quote for docker compose env-file syntax: double quotes, escaping \ " and $
          quote() {
            local v="$1"
            v="${v//\\/\\\\}"
            v="${v//\"/\\\"}"
            v="${v//\$/\\\$}"
            printf '"%s"' "$v"
          }
          # emit <variable name> <value> [required]
          emit() {
            if [ -z "$2" ]; then
              if [ "${3:-}" = "required" ]; then
                echo "::error::Required secret for $1 is not set."
                exit 1
              fi
              return 0
            fi
            if [[ "$2" == *$'\n'* || "$2" == *$'\r'* ]]; then
              echo "::error::The value for $1 contains a line break, which a .env value cannot hold."
              exit 1
            fi
            printf '%s=%s\n' "$1" "$(quote "$2")" >> "$out"
          }

          echo "# Generated by GitHub Actions run ${GITHUB_RUN_ID} at $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> "$out"
          emit POSTGRES_PASSWORD "$POSTGRES_PASSWORD" required
          emit AUTH_DB_PASSWORD "$AUTH_DB_PASSWORD" required
          emit POWERSYNC_DB_PASSWORD "$POWERSYNC_DB_PASSWORD" required
          emit JWT_SECRET "$JWT_SECRET" required
          emit JWT_EXPIRY "${JWT_EXPIRY:-3600}"
          # The database passwords are put into connection URLs unescaped.
          for name in POSTGRES_PASSWORD AUTH_DB_PASSWORD POWERSYNC_DB_PASSWORD; do
            if [[ ! "${!name}" =~ ^[A-Za-z0-9._~-]+$ ]]; then
              echo "::error::$name may only contain letters, digits and . _ ~ - (use openssl rand -hex 32)."
              exit 1
            fi
          done
          # IMAGE_TAG is added by deploy.sh on the server.

      - name: Upload files to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          source: "server/docker-compose.prod.yaml,server/postgres/,server/powersync/,server/deploy/,server/deploy.env"
          target: "/tmp/mini-vault-deploy/"
          strip_components: 1
          rm: true
          overwrite: true

      - name: Deploy on server
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ steps.render.outputs.image_tag }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          envs: IMAGE_TAG,REGISTRY_USER,REGISTRY_TOKEN
          command_timeout: 20m
          script: bash /tmp/mini-vault-deploy/deploy/deploy.sh
