name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*.*.*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Flutter 3.50.0 ships Dart 3.14.0, matching the workspace's `sdk: ^3.14.0`.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: dart analyze

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: domain_core tests
        working-directory: domain_core
        run: dart test

      - name: app widget tests
        working-directory: app
        run: flutter test

      - name: Start server stack
        working-directory: server
        run: |
          cp .env.example .env
          # Throwaway secrets for this run only.
          sed -i \
            -e "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 16)/" \
            -e "s/^AUTH_DB_PASSWORD=.*/AUTH_DB_PASSWORD=$(openssl rand -hex 16)/" \
            -e "s/^POWERSYNC_DB_PASSWORD=.*/POWERSYNC_DB_PASSWORD=$(openssl rand -hex 16)/" \
            -e "s/^JWT_SECRET=.*/JWT_SECRET=$(openssl rand -hex 32)/" \
            .env
          docker compose up -d --build --wait

      - name: server tests
        working-directory: server
        run: dart test

      - name: Dump server stack logs
        if: failure()
        working-directory: server
        run: docker compose logs

  # Publishes the api/migrate image on main and v*.*.* tags; PRs only build it.
  build:
    name: build
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      # GHCR needs lowercase; github.repository keeps the owner's capitals.
      IMAGE: ghcr.io/itsmajorspace/mini-vault-server
      PUBLISH: ${{ github.event_name != 'pull_request' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Not for pull requests from forks: they get a read-only token.
      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short,enable=${{ github.event_name != 'pull_request' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: ${{ env.PUBLISH == 'true' && format('type=registry,ref={0}:buildcache,mode=max', env.IMAGE) || '' }}

  # Sideloadable release APK against production, signed with the release key.
  apk:
    name: apk
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The signing secrets live in the production environment.
    environment: production
    permissions:
      contents: write  # attach the APK to the GitHub Release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Runs Gradle; AGP 9.3 lint needs JDK 21 (the app still targets Java 17).
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true

      # Never ship a debug-signed APK on a tag: fail if any secret is missing.
      - name: Write release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!v}" ] || { echo "::error::Signing secret for $v is not set."; exit 1; }
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      # The tag is the only source of the app version (ADR 0006).
      - name: Build release APK
        working-directory: app
        env:
          TAG: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          flutter build apk --release
          --build-name="${TAG#v}"
          --build-number="$BUILD_NUMBER"
          --dart-define=AUTH_URL=https://auth.minivault.bingoscape.org
          --dart-define=POWERSYNC_URL=https://sync.minivault.bingoscape.org
          --dart-define=API_URL=https://api.minivault.bingoscape.org

      - name: Check APK version and signature
        env:
          TAG: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          aapt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt
          "$aapt" dump badging app/build/app/outputs/flutter-apk/app-release.apk > badging.txt
          grep -F "versionCode='$BUILD_NUMBER' versionName='${TAG#v}'" badging.txt
          certs=$("$(dirname "$aapt")"/apksigner verify --print-certs app/build/app/outputs/flutter-apk/app-release.apk)
          if grep -q "CN=Android Debug" <<< "$certs"; then echo "::error::APK is debug-signed."; exit 1; fi

      # Creates the Release if only a bare tag was pushed; `|| true` because it
      # usually exists already. A real failure still fails the upload below.
      - name: Attach APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          apk="mini-vault-$TAG.apk"
          cp app/build/app/outputs/flutter-apk/app-release.apk "$apk"
          prerelease=()
          [[ "$TAG" == *-* ]] && prerelease=(--prerelease)
          gh release create "$TAG" --verify-tag --generate-notes "${prerelease[@]}" || true
          gh release upload "$TAG" "$apk" --clobber
