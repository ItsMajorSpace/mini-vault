name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*.*.*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Flutter 3.50.0 ships Dart 3.14.0, matching the workspace's `sdk: ^3.14.0`.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: dart analyze

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: domain_core tests
        working-directory: domain_core
        run: dart test

      - name: app widget tests
        working-directory: app
        run: flutter test

      - name: Start server stack
        working-directory: server
        run: |
          cp .env.example .env
          # Throwaway secrets for this run only.
          sed -i \
            -e "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 16)/" \
            -e "s/^AUTH_DB_PASSWORD=.*/AUTH_DB_PASSWORD=$(openssl rand -hex 16)/" \
            -e "s/^POWERSYNC_DB_PASSWORD=.*/POWERSYNC_DB_PASSWORD=$(openssl rand -hex 16)/" \
            -e "s/^JWT_SECRET=.*/JWT_SECRET=$(openssl rand -hex 32)/" \
            .env
          docker compose up -d --build --wait

      - name: server tests
        working-directory: server
        run: dart test

      - name: Dump server stack logs
        if: failure()
        working-directory: server
        run: docker compose logs

  # Publishes the api/migrate image on main and v*.*.* tags; PRs only build it.
  build:
    name: build
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      # GHCR needs lowercase; github.repository keeps the owner's capitals.
      IMAGE: ghcr.io/itsmajorspace/mini-vault-server
      PUBLISH: ${{ github.event_name != 'pull_request' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Not for pull requests from forks: they get a read-only token.
      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short,enable=${{ github.event_name != 'pull_request' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: ${{ env.PUBLISH == 'true' && format('type=registry,ref={0}:buildcache,mode=max', env.IMAGE) || '' }}

  # Sideloadable release APK against production, debug-signed (no keystore).
  apk:
    name: apk
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'pull_request' # TEMP: PR path for verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Runs Gradle; AGP 9.3 lint needs JDK 21 (the app still targets Java 17).
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true

      - name: Build release APK
        working-directory: app
        run: >-
          flutter build apk --release
          --dart-define=AUTH_URL=https://auth.minivault.bingoscape.org
          --dart-define=POWERSYNC_URL=https://sync.minivault.bingoscape.org
          --dart-define=API_URL=https://api.minivault.bingoscape.org

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: mini-vault-${{ github.event_name == 'pull_request' && 'pr' || github.ref_name }}.apk # TEMP
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
