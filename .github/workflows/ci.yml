name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*.*.*"]
  # Builds the desktop archives as workflow artifacts; never touches Releases.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Flutter 3.50.0 ships Dart 3.14.0, matching the workspace's `sdk: ^3.14.0`.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: dart analyze

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: domain_core tests
        working-directory: domain_core
        run: dart test

      - name: app widget tests
        working-directory: app
        run: flutter test

      - name: Start server stack
        working-directory: server
        run: |
          cp .env.example .env
          # Throwaway secrets for this run only.
          sed -i \
            -e "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 16)/" \
            -e "s/^AUTH_DB_PASSWORD=.*/AUTH_DB_PASSWORD=$(openssl rand -hex 16)/" \
            -e "s/^POWERSYNC_DB_PASSWORD=.*/POWERSYNC_DB_PASSWORD=$(openssl rand -hex 16)/" \
            -e "s/^JWT_SECRET=.*/JWT_SECRET=$(openssl rand -hex 32)/" \
            .env
          docker compose up -d --build --wait

      - name: server tests
        working-directory: server
        run: dart test

      - name: Dump server stack logs
        if: failure()
        working-directory: server
        run: docker compose logs

  # Publishes the api/migrate image on main and v*.*.* tags; PRs and manual runs only build it.
  build:
    name: build
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      # GHCR needs lowercase; github.repository keeps the owner's capitals.
      IMAGE: ghcr.io/itsmajorspace/mini-vault-server
      PUBLISH: ${{ github.event_name == 'push' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Not for pull requests from forks: they get a read-only token.
      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short,enable=${{ github.event_name != 'pull_request' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: ${{ env.PUBLISH == 'true' && format('type=registry,ref={0}:buildcache,mode=max', env.IMAGE) || '' }}

  # Sideloadable release APK and Play AAB against production, signed with the release key.
  apk:
    name: apk
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The signing secrets live in the production environment.
    environment: production
    permissions:
      contents: write  # attach the APK and AAB to the GitHub Release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Runs Gradle; AGP 9.3 lint needs JDK 21 (the app still targets Java 17).
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true

      # Never ship a debug-signed APK on a tag: fail if any secret is missing.
      - name: Write release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!v}" ] || { echo "::error::Signing secret for $v is not set."; exit 1; }
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      # The tag is the only source of the app version (ADR 0006).
      - name: Build release APK and AAB
        working-directory: app
        env:
          TAG: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for target in apk appbundle; do
            flutter build "$target" --release \
              --build-name="${TAG#v}" \
              --build-number="$BUILD_NUMBER" \
              --dart-define=AUTH_URL=https://auth.minivault.bingoscape.org \
              --dart-define=POWERSYNC_URL=https://sync.minivault.bingoscape.org \
              --dart-define=API_URL=https://api.minivault.bingoscape.org
          done

      - name: Check APK version and signature, AAB signed with the same key
        env:
          TAG: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          aapt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt
          "$aapt" dump badging app/build/app/outputs/flutter-apk/app-release.apk > badging.txt
          grep -F "versionCode='$BUILD_NUMBER' versionName='${TAG#v}'" badging.txt
          certs=$("$(dirname "$aapt")"/apksigner verify --print-certs app/build/app/outputs/flutter-apk/app-release.apk)
          if grep -q "CN=Android Debug" <<< "$certs"; then echo "::error::APK is debug-signed."; exit 1; fi
          apk_sha=$(grep -m1 'certificate SHA-256 digest' <<< "$certs" | awk '{print $NF}')
          aab_sha=$(keytool -printcert -jarfile app/build/app/outputs/bundle/release/app-release.aab | awk '/SHA256:/ {print $2}' | tr -d : | tr A-F a-f)
          [ -n "$apk_sha" ] && [ "$apk_sha" = "$aab_sha" ] || { echo "::error::AAB and APK certificates differ ($aab_sha vs $apk_sha)."; exit 1; }

      # Creates the Release if only a bare tag was pushed; `|| true` because it
      # usually exists already. A real failure still fails the upload below.
      - name: Attach APK and AAB to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          apk="mini-vault-$TAG.apk"
          aab="mini-vault-$TAG.aab"
          cp app/build/app/outputs/flutter-apk/app-release.apk "$apk"
          cp app/build/app/outputs/bundle/release/app-release.aab "$aab"
          prerelease=()
          [[ "$TAG" == *-* ]] && prerelease=(--prerelease)
          gh release create "$TAG" --verify-tag --generate-notes --notes "Install: https://github.com/$GH_REPO#get-the-app" "${prerelease[@]}" || true
          gh release upload "$TAG" "$apk" "$aab" --clobber

  # Unsigned desktop archives against production. Tags attach them to the
  # Release; manual runs keep them as workflow artifacts.
  desktop:
    name: ${{ matrix.os }}
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: write  # attach the archive to the GitHub Release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows, runner: windows-latest }
          - { os: macos, runner: macos-latest }
          - { os: linux, runner: ubuntu-latest }
    defaults:
      run:
        shell: bash
    env:
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
      # A manual run has no tag, so it gets a visibly-dev version.
      TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.0.0-dev' }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true

      # The tag is the only source of the app version (ADR 0006).
      - name: Build and package
        working-directory: app
        env:
          OS: ${{ matrix.os }}
        run: |
          flutter build "$OS" --release \
            --build-name="${TAG#v}" \
            --build-number="$BUILD_NUMBER" \
            --dart-define=AUTH_URL=https://auth.minivault.bingoscape.org \
            --dart-define=POWERSYNC_URL=https://sync.minivault.bingoscape.org \
            --dart-define=API_URL=https://api.minivault.bingoscape.org
          dist="$GITHUB_WORKSPACE/dist"
          mkdir -p "$dist"
          case "$OS" in
            windows)
              test -f build/windows/x64/runner/Release/mini_vault.exe
              (cd build/windows/x64/runner/Release && 7z a -tzip "$dist/mini-vault-$TAG-windows-x64.zip" .) ;;
            macos)
              test -d "build/macos/Build/Products/Release/Mini Vault.app/Contents/MacOS"
              ditto -c -k --keepParent "build/macos/Build/Products/Release/Mini Vault.app" "$dist/mini-vault-$TAG-macos.zip" ;;
            linux)
              test -x build/linux/x64/release/bundle/mini_vault
              tar -czf "$dist/mini-vault-$TAG-linux-x64.tar.gz" \
                --transform 's,^\.,mini-vault,' -C build/linux/x64/release/bundle . ;;
          esac
          ls -l "$dist"

      - name: Keep archive as workflow artifact
        if: env.IS_TAG != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: mini-vault-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

      # Same race-tolerant create as the apk job.
      - name: Attach archive to GitHub Release
        if: env.IS_TAG == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prerelease=()
          [[ "$TAG" == *-* ]] && prerelease=(--prerelease)
          gh release create "$TAG" --verify-tag --generate-notes --notes "Install: https://github.com/$GH_REPO#get-the-app" "${prerelease[@]}" || true
          gh release upload "$TAG" dist/* --clobber
