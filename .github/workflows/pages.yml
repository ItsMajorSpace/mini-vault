name: Pages

# Publishes docs/privacy at https://itsmajorspace.github.io/mini-vault/privacy/.
# Needs Settings > Pages > Source set to "GitHub Actions".
on:
  push:
    branches: [main]
    paths: [docs/privacy/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}privacy/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs/privacy
          destination: ./_site/privacy
      - uses: actions/upload-pages-artifact@v4
      - id: deployment
        uses: actions/deploy-pages@v4
