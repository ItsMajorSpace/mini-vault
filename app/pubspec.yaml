name: mini_vault
description: "Mini Vault: track a tabletop miniature collection from wishlist to finished."
publish_to: 'none'
version: 0.0.0-dev+0
resolution: workspace

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  domain_core:
    path: ../domain_core
  path_provider: ^2.1.6
  gotrue: ^2.27.3
  powersync: ^2.6.1
  http: ^1.6.0
  image_picker: ^1.2.4
  image: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  fonts:
    - family: BlackOpsOne
      fonts:
        - asset: assets/fonts/BlackOpsOne-Regular.ttf

# Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  android: true
  min_sdk_android: 21
  adaptive_icon_background: "#16181B"
  adaptive_icon_foreground: assets/icon/app_icon.png
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#16181B"
